<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>ChatGPT Quota</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="loading">
    <main class="widget">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <header class="titlebar">
        <div class="brand">
          <span id="trafficLight" class="traffic-light loading" aria-hidden="true"></span>
          <div class="brand-copy">
            <span id="brandName" class="brand-name">ChatGPT Quota</span>
            <div class="brand-meta">
              <span id="stateText" class="brand-state">读取中</span>
              <span class="updated-state">
                <span id="statusDot" class="status-dot loading" aria-hidden="true"></span>
                <span id="statusText">正在刷新</span>
              </span>
              <button id="headerRefreshBtn" class="header-refresh" type="button" title="刷新" aria-label="刷新">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="window-actions">
          <button id="settingsBtn" class="icon-button more-button" title="更多" aria-label="更多" aria-expanded="false">···</button>
          <button id="minimizeBtn" class="icon-button" title="隐藏" aria-label="隐藏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button id="closeBtn" class="icon-button danger" title="退出" aria-label="退出">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <button id="settingsBackdrop" class="settings-backdrop" type="button" aria-label="关闭菜单" hidden></button>
      <aside id="settingsPanel" class="settings-panel" hidden>
        <div class="settings-heading">
          <strong id="settingsTitle">更多</strong>
          <span id="settingsHint">快捷操作与显示设置</span>
        </div>
        <div class="menu-actions">
          <button id="refreshBtn" class="panel-action" type="button">刷新</button>
          <button id="pinBtn" class="panel-action active" type="button">取消置顶</button>
          <button id="langBtn" class="panel-action" type="button">English</button>
        </div>
        <label class="setting-row">
          <span id="showFiveHourLabel">5小时额度</span>
          <input id="showFiveHourInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="showWeeklyLabel">7天额度</span>
          <input id="showWeeklyInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="showLiquidLabel">水位显示</span>
          <input id="showLiquidInput" type="checkbox" checked />
        </label>
        <label class="setting-source">
          <span id="liquidSourceLabel">水位代表</span>
          <select id="liquidSourceInput">
            <option id="liquidFiveHourOption" value="fiveHour">5小时额度</option>
            <option id="liquidWeeklyOption" value="weekly" selected>7天额度</option>
          </select>
        </label>
        <label class="setting-opacity">
          <span id="opacityLabel">透明度</span>
          <span class="opacity-control">
            <input id="opacityInput" type="range" min="40" max="100" step="1" value="100" />
            <output id="opacityValue" for="opacityInput">100%</output>
          </span>
        </label>
        <label class="setting-source">
          <span id="refreshIntervalLabel">刷新间隔</span>
          <select id="refreshIntervalInput">
            <option value="0.16666666666666666">10 秒</option>
            <option value="0.5">30 秒</option>
            <option value="1">1 分钟</option>
            <option value="5" selected>5 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </label>
        <label class="setting-opacity">
          <span id="approvalWaitLabel">批准等待</span>
          <span class="opacity-control">
            <input id="approvalWaitInput" type="range" min="5" max="30" step="1" value="12" />
            <output id="approvalWaitValue" for="approvalWaitInput">12 秒</output>
          </span>
        </label>
        <label class="setting-row shortcut-row">
          <span id="approvalShortcutLabel">快捷键 Ctrl+Alt+A</span>
          <input id="approvalShortcutInput" type="checkbox" checked />
        </label>
      </aside>

      <section class="content">
        <div id="liquidMeter" class="liquid-meter" aria-label="ChatGPT Quota 剩余额度">
          <div class="glass-rim"></div>
          <canvas id="liquidCanvas" class="liquid-canvas" aria-hidden="true"></canvas>
          <div class="shine"></div>
          <div class="meter-copy">
            <strong id="remaining">--%</strong>
            <span id="remainingLabel">剩余</span>
          </div>
        </div>

        <div class="quota-panel">
          <div id="fiveHourCard" class="quota-card primary">
            <span id="fiveHourLabel">5小时</span>
            <strong id="fiveHourText">--</strong>
          </div>
          <div id="weeklyCard" class="quota-card primary">
            <span id="weeklyLabel">7天</span>
            <strong id="weeklyText">--</strong>
          </div>
          <div class="quota-meta-row">
            <div class="quota-card slim">
              <span id="planLabel">计划</span>
              <strong id="planText">--</strong>
            </div>
            <div class="quota-card token-card">
              <span id="todayTokenLabel">今日 Token</span>
              <strong id="todayTokenText">--</strong>
            </div>
          </div>
          <button id="approvalBtn" class="approval-button" type="button" aria-live="polite">批准</button>
        </div>
      </section>
      <button id="compactBall" class="compact-ball" type="button" aria-label="恢复完整挂件" hidden>
        <canvas id="compactLiquidCanvas" class="compact-liquid-canvas" aria-hidden="true"></canvas>
        <strong id="compactPercent">--%</strong>
        <span id="compactSource">7天剩余</span>
      </button>
    </main>

    <script src="./liquid-simulation.js"></script>
    <script src="./widget-logic.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
